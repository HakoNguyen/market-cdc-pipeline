name: CI

on:
  push:
    branches: [main, refactor/sota-upgrade]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt ruff==0.6.9

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -m "not integration"

      # Biên dịch toàn bộ project dbt (ref, source, test, snapshot) mà không cần StarRocks
      - name: dbt parse
        working-directory: market_cdc
        run: dbt parse --profiles-dir .

      - name: docker compose config
        run: cp .env.example .env && docker compose config --quiet
