version: 2

models: 
  - name: stg_daily_bar
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, trade_date]
    columns:
      - name: symbol
        tests:
          - not_null
      - name: trade_date
        tests:
          - not_null
      # thiếu giá sàn công bố thì test biên độ và test giá tham chiếu bị bỏ qua âm thầm
      - name: reference_price
        tests:
          - not_null
      - name: ceiling_price
        tests:
          - not_null
      - name: floor_price
        tests:
          - not_null

  - name: int_adjustment_factor
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, ex_date]

  - name: dim_instrument
    columns: 
      - name: symbol
        tests: 
          - not_null
          - unique
  
  - name: fct_daily_bars
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, trade_date]
    columns:
      - name: symbol
        tests: 
          - not_null
          - relationships: 
              arguments:
                to: ref('dim_instrument')
                field: symbol
      - name: trade_date
        tests: 
          - not_null
  
  - name: fct_corporate_actions
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, ex_date, action_type]
    columns:
      - name: symbol
        tests: 
          - not_null
      - name: ex_date
        tests:
          - not_null
      - name: action_type
        tests:
          - accepted_values:
              arguments:
                values: ['cash_dividend', 'stock_dividend', 'bonus_share', 'rights_issue']